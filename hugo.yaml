baseURL: https://www.chunshu.org
locale: zh-CN
title: 春树 Chun Shu
theme: PaperMod
hasCJKLanguage: true
summaryLength: 200
paginate: 10
buildFuture: true
buildExpired: false
uglyURLs: true
taxonomies:
  category: categories
  tag: tags
permalinks:
  taxonomy:
    category: /category/
  term:
    category: /category/:slug/
  page:
    posts: /archives/:contentbasename
params:
  description: A writer's life
  comments: true
  author:
    name: admin
markup:
  highlight:
    codeFences: true
    guessSyntax: true
  goldmark:
    renderer:
      unsafe: true
outputs:
  home:
    - HTML
    - RSS
    - JSON
outputFormats:
  HTML:
    mediaType: text/html
    baseName: index
    rel: canonical
    isHTML: true
    noUgly: true
  HTMLPost:
    mediaType: text/html
    baseName: index
    rel: canonical
    isHTML: true
  RSS:
    mediaType: application/rss+xml
    baseName: feed
menu:
