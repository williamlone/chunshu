<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "zh-CN" }}">
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
	<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
	<link rel="stylesheet" href="{{ "css/style.css" | relURL }}" type="text/css" media="screen" />
	<link rel="stylesheet" href="{{ "css/hugo.css" | relURL }}" type="text/css" media="screen" />
	{{ with .OutputFormats.Get "RSS" -}}
	<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .RelPermalink }}" />
	{{ end -}}
	{{ hugo.Generator }}
</head>
<body class="{{ if .IsHome }}home blog{{ else if eq .Kind "page" }}{{ if eq .Section "posts" }}single{{ else }}page{{ end }}{{ else }}archive{{ end }} layout-2cr">

	<!-- BEGIN #container -->
	<div id="container">

		{{ partial "header.html" . }}

		<!--BEGIN #content -->
		<div id="content" class="clearfix">
			<!-- BEGIN #content-wrap -->
			<div id="content-wrap" class="clearfix">

				<div id="content-top">&nbsp;</div>

				<!--BEGIN #primary .hfeed-->
				<div id="primary" class="hfeed">
					{{ block "main" . }}{{ end }}
				<!--END #primary .hfeed-->
				</div>

				<div id="content-btm">&nbsp;</div>

			<!-- END #content-wrap -->
			</div>

			{{ partial "sidebar.html" . }}

		<!-- END #content -->
		</div>

		{{ partial "footer.html" . }}

	<!-- END #container -->
	</div>

</body>
</html>
